<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일정 성분비 법칙 시뮬레이션</title>
    <!-- Tailwind CSS (스타일링용 CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 및 ReactDOM (기능 구동용 CDN) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel (브라우저에서 JSX를 변환해주는 CDN) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 아이콘 컴포넌트 (외부 라이브러리 없이 직접 렌더링)
        const PlayIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
        );
        const PauseIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="14" y="4" width="4" height="16"/><rect x="6" y="4" width="4" height="16"/></svg>
        );
        const ResetIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        );
        const FlameIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="#f97316" stroke="#f97316" strokeWidth="1" strokeLinecap="round" strokeLinejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
        );

        const App = () => {
            // 상태 관리
            const [massCu, setMassCu] = useState(4); // 초기 구리 질량 (g)
            const [progress, setProgress] = useState(0); // 반응 진행도 (0 ~ 100)
            const [isHeating, setIsHeating] = useState(false); // 가열 중 여부

            // 반응 진행에 따른 계산된 질량
            const currentMassO = (massCu / 4) * (progress / 100);
            const currentMassCuO = massCu + currentMassO;

            // 타이머 효과 (애니메이션 진행)
            useEffect(() => {
                let timer;
                if (isHeating) {
                    timer = setInterval(() => {
                        setProgress((prev) => {
                            if (prev >= 100) {
                                setIsHeating(false);
                                return 100;
                            }
                            return prev + 0.5; // 애니메이션 속도
                        });
                    }, 30);
                }
                return () => clearInterval(timer);
            }, [isHeating]);

            // 구리 질량 변경 핸들러 (슬라이더 조작 시 초기화)
            const handleMassChange = (e) => {
                setMassCu(Number(e.target.value));
                setProgress(0);
                setIsHeating(false);
            };

            // 진행도에 따른 색상 계산 (구리색 -> 검은색, 산소 빨간색 -> 검은색)
            const cuR = Math.round(200 - (200 - 50) * (progress / 100));
            const cuG = Math.round(122 - (122 - 50) * (progress / 100));
            const cuB = Math.round(65 - (65 - 50) * (progress / 100));
            const powderColor = `rgb(${cuR}, ${cuG}, ${cuB})`;

            const oR = Math.round(239 - (239 - 50) * (progress / 100));
            const oG = Math.round(68 - (68 - 50) * (progress / 100));
            const oB = Math.round(68 - (68 - 50) * (progress / 100));
            const oxygenColor = `rgb(${oR}, ${oG}, ${oB})`;

            return (
                <div className="min-h-screen bg-slate-50 p-6 font-sans text-slate-800">
                    <div className="max-w-6xl mx-auto space-y-6">
                        
                        {/* 헤더 섹션 */}
                        <header className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <h1 className="text-2xl md:text-3xl font-bold text-slate-900 mb-2">
                                일정 성분비 법칙 시뮬레이션: 산화 구리(II) 생성
                            </h1>
                            <p className="text-slate-600">
                                구리를 가열하면 공기 중의 산소와 결합하여 검은색의 산화 구리(II)가 됩니다. 
                                반응하는 <strong>구리와 산소, 생성되는 산화 구리(II)의 질량비는 항상 4 : 1 : 5</strong>로 일정합니다.
                            </p>
                        </header>

                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                            
                            {/* 왼쪽 패널 (제어 및 거시적 관찰) */}
                            <div className="lg:col-span-5 space-y-6">
                                
                                {/* 조작 패널 */}
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                    <h2 className="text-xl font-semibold mb-4 flex items-center gap-2">
                                        <span className="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-sm">1</span>
                                        실험 조건 설정
                                    </h2>
                                    
                                    <div className="space-y-6">
                                        <div>
                                            <div className="flex justify-between mb-2">
                                                <label className="font-medium text-slate-700">구리(Cu) 질량 선택</label>
                                                <span className="font-bold text-blue-600">{massCu} g</span>
                                            </div>
                                            <input
                                                type="range"
                                                min="4"
                                                max="20"
                                                step="4"
                                                value={massCu}
                                                onChange={handleMassChange}
                                                className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600"
                                                disabled={progress > 0 && progress < 100}
                                            />
                                            <div className="flex justify-between text-xs text-slate-400 mt-1">
                                                <span>4g</span>
                                                <span>8g</span>
                                                <span>12g</span>
                                                <span>16g</span>
                                                <span>20g</span>
                                            </div>
                                        </div>

                                        <div className="flex gap-3">
                                            <button
                                                onClick={() => setIsHeating(!isHeating)}
                                                disabled={progress >= 100}
                                                className={`flex-1 flex items-center justify-center gap-2 py-3 px-4 rounded-xl font-medium transition-all ${
                                                    progress >= 100
                                                        ? 'bg-slate-100 text-slate-400 cursor-not-allowed'
                                                        : isHeating
                                                        ? 'bg-orange-100 text-orange-700 hover:bg-orange-200'
                                                        : 'bg-blue-600 text-white hover:bg-blue-700'
                                                }`}
                                            >
                                                {isHeating ? <PauseIcon /> : <PlayIcon />}
                                                {isHeating ? '가열 중지' : '가열 시작'}
                                            </button>
                                            <button
                                                onClick={() => {
                                                    setProgress(0);
                                                    setIsHeating(false);
                                                }}
                                                className="flex items-center justify-center gap-2 py-3 px-4 rounded-xl font-medium bg-slate-100 text-slate-700 hover:bg-slate-200 transition-all"
                                            >
                                                <ResetIcon />
                                                초기화
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {/* 거시적 관찰 (실험 기구) */}
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col items-center justify-center min-h-[300px]">
                                    <h2 className="text-xl font-semibold mb-8 w-full flex items-center gap-2">
                                        <span className="w-8 h-8 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center text-sm">2</span>
                                        거시적 변화 (가열 실험)
                                    </h2>
                                    
                                    <div className="relative w-full h-48 flex justify-center items-center mt-4">
                                        {/* 삼각대 */}
                                        <div className="absolute bottom-4 w-32 h-20 border-t-4 border-slate-600 border-l-4 border-r-4 rounded-t-lg"></div>
                                        {/* 도가니 */}
                                        <div className="absolute bottom-24 w-28 h-16 bg-slate-200 rounded-b-full border-2 border-slate-500 flex justify-center items-end pb-1 overflow-hidden shadow-inner z-10">
                                            {/* 구리 가루 */}
                                            <div
                                                className="w-[85%] transition-all duration-300 rounded-[50%_50%_20%_20%]"
                                                style={{
                                                    height: `${20 + (massCu / 20) * 25}px`, // 질량에 따른 시각적 부피 변화
                                                    backgroundColor: powderColor,
                                                }}
                                            ></div>
                                        </div>
                                        {/* 불꽃 */}
                                        <div
                                            className={`absolute bottom-6 text-red-500 transition-opacity duration-300 z-0 ${
                                                isHeating ? 'opacity-100 animate-pulse' : 'opacity-0'
                                            }`}
                                        >
                                            <FlameIcon />
                                        </div>
                                    </div>
                                    <div className="mt-8 text-center bg-slate-50 p-3 rounded-lg w-full">
                                        <p className="font-medium text-slate-700">현재 상태: {progress === 0 ? '가열 전 (구리)' : progress >= 100 ? '반응 완료 (산화 구리)' : '가열 중 (산화 반응 진행)'}</p>
                                    </div>
                                </div>
                            </div>

                            {/* 오른쪽 패널 (미시적 관찰 및 그래프) */}
                            <div className="lg:col-span-7 space-y-6">
                                
                                {/* 미시적 관찰 (원자 모형) */}
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                    <h2 className="text-xl font-semibold mb-2 flex items-center gap-2">
                                        <span className="w-8 h-8 rounded-full bg-green-100 text-green-600 flex items-center justify-center text-sm">3</span>
                                        미시적 변화 (원자 모형)
                                    </h2>
                                    <div className="text-center mb-4 text-slate-600 font-medium bg-slate-50 py-2 rounded-lg">
                                        반응식: 2Cu + O₂ → 2CuO
                                    </div>
                                    
                                    <div className="w-full bg-slate-900 rounded-xl overflow-hidden relative" style={{ height: '240px' }}>
                                        <svg width="100%" height="100%" viewBox="0 0 500 240" preserveAspectRatio="xMidYMid meet">
                                            {/* 배경 장식 */}
                                            <rect width="100%" height="100%" fill="#0f172a" />
                                            <line x1="0" y1="200" x2="500" y2="200" stroke="#334155" strokeWidth="2" />
                                            
                                            {/* 구리 원자들 렌더링 (질량에 따라 개수 변동) */}
                                            {Array.from({ length: massCu }).map((_, i) => {
                                                const viewBoxWidth = 500;
                                                const spacing = viewBoxWidth / massCu;
                                                const targetX = spacing * (i + 0.5);
                                                const targetY = 185;

                                                return (
                                                    <g key={`cu-${i}`}>
                                                        <circle
                                                            cx={targetX}
                                                            cy={targetY}
                                                            r={14}
                                                            fill={powderColor}
                                                            stroke="rgba(0,0,0,0.2)"
                                                            strokeWidth="2"
                                                        />
                                                        <text x={targetX} y={targetY + 4} fontSize="11" fill="white" textAnchor="middle" fontWeight="bold">Cu</text>
                                                    </g>
                                                );
                                            })}

                                            {/* 산소 분자들 렌더링 (구리 20g 기준인 20개 원자 / 10개 분자를 항상 유지) */}
                                            {Array.from({ length: 20 }).map((_, i) => {
                                                const viewBoxWidth = 500;
                                                const isEven = i % 2 === 0;
                                                const pairIndex = Math.floor(i / 2);
                                                
                                                // 초기 산소 분자 위치 (10개의 쌍을 균등 배치)
                                                const o2Spacing = viewBoxWidth / 10;
                                                const o2CenterX = o2Spacing * (pairIndex + 0.5);
                                                const o2StartY = 50;
                                                const oStartX = isEven ? o2CenterX - 14 : o2CenterX + 14;

                                                // 현재 설정된 구리의 개수(massCu)만큼만 산소가 반응함
                                                const isReacting = i < massCu;

                                                let currentOX = oStartX;
                                                let currentOY = o2StartY;
                                                let currentColor = 'rgb(239, 68, 68)'; // 반응하지 않고 남는 산소의 기본 색상

                                                if (isReacting) {
                                                    // 반응하는 산소만 구리 위치로 이동
                                                    const cuSpacing = viewBoxWidth / massCu;
                                                    const cuTargetX = cuSpacing * (i + 0.5);
                                                    const cuTargetY = 185;
                                                    
                                                    currentOX = oStartX + (cuTargetX - oStartX) * (progress / 100);
                                                    currentOY = o2StartY + (cuTargetY - 28 - o2StartY) * (progress / 100);
                                                    currentColor = oxygenColor; // 진행도에 따라 검은색으로 변함
                                                }

                                                return (
                                                    <g key={`o-${i}`}>
                                                        {/* 산소 분자 연결 선 (반응하는 쌍만 끊어지며 사라짐) */}
                                                        {isEven && (
                                                            <line
                                                                x1={oStartX}
                                                                y1={o2StartY}
                                                                x2={oStartX + 28}
                                                                y2={o2StartY}
                                                                stroke={isReacting ? oxygenColor : currentColor}
                                                                strokeWidth="4"
                                                                opacity={isReacting ? Math.max(0, 1 - (progress / 30)) : 1}
                                                            />
                                                        )}
                                                        
                                                        {/* 산소 원자 */}
                                                        <circle
                                                            cx={currentOX}
                                                            cy={currentOY}
                                                            r={12}
                                                            fill={currentColor}
                                                            stroke="rgba(0,0,0,0.2)"
                                                            strokeWidth="2"
                                                        />
                                                        <text x={currentOX} y={currentOY + 4} fontSize="10" fill="white" textAnchor="middle" fontWeight="bold">O</text>
                                                    </g>
                                                );
                                            })}
                                        </svg>
                                    </div>
                                </div>

                                {/* 데이터 및 그래프 패널 */}
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                    <h2 className="text-xl font-semibold mb-6 flex items-center gap-2">
                                        <span className="w-8 h-8 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center text-sm">4</span>
                                        질량 변화 그래프
                                    </h2>

                                    <div className="space-y-4">
                                        {/* 구리 질량 바 */}
                                        <div>
                                            <div className="flex justify-between mb-1 text-sm font-medium">
                                                <span className="text-orange-700">구리 (Cu) 질량</span>
                                                <span>{massCu.toFixed(1)} g</span>
                                            </div>
                                            <div className="w-full bg-slate-100 h-6 rounded-full overflow-hidden">
                                                <div
                                                    className="h-full bg-orange-600 transition-all duration-300 rounded-full"
                                                    style={{ width: `${(massCu / 25) * 100}%` }}
                                                ></div>
                                            </div>
                                        </div>

                                        {/* 결합한 산소 질량 바 */}
                                        <div>
                                            <div className="flex justify-between mb-1 text-sm font-medium">
                                                <span className="text-red-600">결합한 산소 (O) 질량</span>
                                                <span>{currentMassO.toFixed(1)} g</span>
                                            </div>
                                            <div className="w-full bg-slate-100 h-6 rounded-full overflow-hidden">
                                                <div
                                                    className="h-full bg-red-500 transition-all duration-300 rounded-full"
                                                    style={{ width: `${(currentMassO / 25) * 100}%` }}
                                                ></div>
                                            </div>
                                        </div>

                                        {/* 생성된 산화구리 질량 바 */}
                                        <div>
                                            <div className="flex justify-between mb-1 text-sm font-medium">
                                                <span className="text-slate-800">생성된 산화 구리(II) (CuO) 총 질량</span>
                                                <span className="font-bold">{currentMassCuO.toFixed(1)} g</span>
                                            </div>
                                            <div className="w-full bg-slate-100 h-6 rounded-full overflow-hidden flex">
                                                <div
                                                    className="h-full bg-slate-800 transition-all duration-300 rounded-full"
                                                    style={{ width: `${(currentMassCuO / 25) * 100}%` }}
                                                ></div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* 질량비 요약 */}
                                    <div className="mt-8 grid grid-cols-3 gap-4 text-center">
                                        <div className="bg-orange-50 p-3 rounded-xl border border-orange-100">
                                            <div className="text-sm text-orange-600 font-medium mb-1">구리 (Cu)</div>
                                            <div className="text-xl font-bold text-orange-700">4</div>
                                        </div>
                                        <div className="bg-red-50 p-3 rounded-xl border border-red-100 relative">
                                            <div className="absolute top-1/2 -left-3 transform -translate-y-1/2 font-bold text-slate-400">:</div>
                                            <div className="text-sm text-red-600 font-medium mb-1">산소 (O)</div>
                                            <div className="text-xl font-bold text-red-700">1</div>
                                            <div className="absolute top-1/2 -right-3 transform -translate-y-1/2 font-bold text-slate-400">:</div>
                                        </div>
                                        <div className="bg-slate-100 p-3 rounded-xl border border-slate-200">
                                            <div className="text-sm text-slate-600 font-medium mb-1">산화 구리 (CuO)</div>
                                            <div className="text-xl font-bold text-slate-800">5</div>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
