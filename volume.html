<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기체 반응 법칙 가상 실험실</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel (for JSX compilation in browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fade-in 0.4s ease-out forwards;
    }
    @keyframes bounce-slight {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .animate-bounce-slight {
      animation: bounce-slight 2.5s ease-in-out infinite;
    }
    
    /* 스크롤바 커스텀 */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9; 
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1; 
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8; 
    }
  </style>
</head>
<body class="bg-slate-50 text-gray-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // --- 커스텀 아이콘 (Lucide 대체) ---
    const createIcon = (paths) => ({ className = "", fill = "none" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {paths}
      </svg>
    );

    const Beaker = createIcon(<><path d="M4.5 3h15"/><path d="M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3"/><path d="M6 14h12"/></>);
    const Info = createIcon(<><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></>);
    const RefreshCw = createIcon(<><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></>);
    const Play = createIcon(<><polygon points="5 3 19 12 5 21 5 3"/></>);
    const ArrowRight = createIcon(<><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></>);
    const Droplets = createIcon(<><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7 2.9 7 2.9s-2.29 6.16-2.29 6.16C3.57 10 3 11.08 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M15.5 21c2.48 0 4.5-2.02 4.5-4.5 0-1.3-.64-2.5-1.9-3.53-1.28-1.04-2.6-4.97-2.6-4.97s-1.32 3.93-2.6 4.97c-1.26 1.03-1.9 2.23-1.9 3.53 0 2.48 2.02 4.5 4.5 4.5z"/></>);
    const FlaskConical = createIcon(<><path d="M10 2v7.31L2 20.5A2 2 0 0 0 3.5 24h17a2 2 0 0 0 1.5-3.5L14 9.31V2"/><path d="M8.5 2h7"/><path d="M14 9l7 10.5"/><path d="M2 19.5l7-10.5"/></>);
    const CheckCircle2 = createIcon(<><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></>);
    const XCircle = createIcon(<><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></>);
    const BookOpen = createIcon(<><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>);
    const AlertCircle = createIcon(<><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></>);

    // --- 분자 SVG 컴포넌트 ---
    const Molecule = ({ type, className = "" }) => {
      if (type === 'H2') {
        return (
          <svg viewBox="0 0 100 100" className={`drop-shadow-sm ${className}`}>
            <circle cx="35" cy="50" r="22" fill="#f8fafc" stroke="#94a3b8" strokeWidth="3" />
            <circle cx="65" cy="50" r="22" fill="#f8fafc" stroke="#94a3b8" strokeWidth="3" />
            <text x="50" y="55" fontSize="18" textAnchor="middle" fill="#475569" fontWeight="bold">H₂</text>
          </svg>
        );
      }
      if (type === 'O2') {
        return (
          <svg viewBox="0 0 100 100" className={`drop-shadow-sm ${className}`}>
            <circle cx="35" cy="50" r="26" fill="#ef4444" stroke="#991b1b" strokeWidth="3" />
            <circle cx="65" cy="50" r="26" fill="#ef4444" stroke="#991b1b" strokeWidth="3" />
            <text x="50" y="56" fontSize="18" textAnchor="middle" fill="#fef2f2" fontWeight="bold">O₂</text>
          </svg>
        );
      }
      if (type === 'H2O') {
        return (
          <svg viewBox="0 0 100 100" className={`drop-shadow-md ${className}`}>
            {/* 산소 */}
            <circle cx="50" cy="55" r="26" fill="#ef4444" stroke="#991b1b" strokeWidth="3" />
            {/* 수소 1 */}
            <circle cx="20" cy="30" r="18" fill="#f8fafc" stroke="#94a3b8" strokeWidth="3" />
            {/* 수소 2 */}
            <circle cx="80" cy="30" r="18" fill="#f8fafc" stroke="#94a3b8" strokeWidth="3" />
            <text x="50" y="62" fontSize="16" textAnchor="middle" fill="#fef2f2" fontWeight="bold">O</text>
          </svg>
        );
      }
      return null;
    };

    // --- 주사기(피스톤) 컴포넌트 ---
    const Syringe = ({ label, volume, maxVolume, bgColor, isEmpty }) => {
      const gasPercent = maxVolume === 0 ? 0 : (volume / maxVolume) * 100;

      // 최대 부피에 따라 눈금 간격 자동 조절
      let tickStep = 1;
      if (maxVolume >= 100) tickStep = 20;
      else if (maxVolume >= 40) tickStep = 10;
      else if (maxVolume >= 15) tickStep = 5;
      
      const tickCount = Math.floor(maxVolume / tickStep);

      return (
        <div className="w-full flex flex-col mb-4">
          <div className="flex justify-between items-end mb-1 px-1">
            <span className="text-sm font-bold text-gray-700">{label}</span>
            <span className="text-xs font-bold text-gray-500 bg-gray-200 px-2 py-0.5 rounded-full">
              현재 부피: {volume}
            </span>
          </div>
          
          <div className="flex items-center h-20 w-full relative">
            {/* 주사기 입구 */}
            <div className="w-3 h-6 border-y-2 border-l-2 border-gray-400 bg-white rounded-l-sm z-10"></div>
            
            {/* 주사기 몸통 */}
            <div className="flex-1 h-full border-2 border-gray-400 bg-white relative flex overflow-hidden rounded-r-md shadow-inner">
              
              {/* 눈금선 */}
              <div className="absolute top-0 left-0 w-full h-full flex pointer-events-none z-20">
                {Array.from({ length: tickCount }).map((_, i) => (
                  <div key={i} className="flex-1 border-r border-gray-300/60 h-full flex flex-col justify-between py-1 relative">
                    <span className="absolute top-1 left-1/2 -translate-x-1/2 text-[10px] text-gray-400 font-medium">
                      {(i + 1) * tickStep}
                    </span>
                    <div className="w-full h-1.5 border-b border-gray-300/60 mt-auto"></div>
                  </div>
                ))}
              </div>

              {/* 기체 공간 */}
              <div 
                className={`h-full transition-all duration-1000 ease-in-out relative flex flex-wrap content-start items-center p-1 gap-1 overflow-hidden ${bgColor}`}
                style={{ width: `${gasPercent}%` }}
              >
                {isEmpty && volume === 0 && (
                  <span className="text-xs text-gray-400 m-auto absolute inset-0 flex items-center justify-center italic">비어있음</span>
                )}
              </div>

              {/* 피스톤 */}
              <div className="flex-1 h-full flex items-center relative z-10">
                <div className="w-4 h-[96%] bg-slate-700 rounded-sm shadow-[-3px_0_6px_rgba(0,0,0,0.2)] flex items-center justify-center border-r border-slate-900">
                  <div className="w-1 h-[80%] bg-slate-500 rounded-full"></div>
                </div>
                <div className="flex-1 h-3 bg-gradient-to-b from-gray-200 via-white to-gray-300 border-y border-gray-400"></div>
              </div>
            </div>
            
            {/* 손잡이 */}
            <div className="w-3 h-12 bg-gray-500 rounded-r-lg shadow-md z-10 border border-gray-600"></div>
          </div>
        </div>
      );
    };

    function App() {
      const [activeTab, setActiveTab] = useState('unknown'); // 'water' | 'unknown'

      // --- 물 합성 실험 상태 ---
      const [h2Count, setH2Count] = useState(2);
      const [o2Count, setO2Count] = useState(1);
      const [isReacted, setIsReacted] = useState(false);

      const waterMaxRx = Math.min(Math.floor(h2Count / 2), o2Count);
      const wReactedH2 = waterMaxRx * 2;
      const wReactedO2 = waterMaxRx * 1;
      const wLeftoverH2 = h2Count - wReactedH2;
      const wLeftoverO2 = o2Count - wReactedO2;
      const wProducedH2O = waterMaxRx * 2;
      const wTotalInitialVolume = h2Count + o2Count;
      const wTotalLeftoverVolume = wLeftoverH2 + wLeftoverO2;

      const generateMolecules = (type, count, sizeClass) => {
        return Array.from({ length: count }).map((_, i) => (
          <div key={`${type}-${i}`} className="animate-fade-in">
            <Molecule type={type} className={sizeClass} />
          </div>
        ));
      };
      const h2oMolecules = generateMolecules('H2O', wProducedH2O, "w-10 h-10 animate-bounce-slight");

      // --- 미지의 기체 반응 탐구 상태 ---
      const [selectedRx, setSelectedRx] = useState(1);
      const [unkA, setUnkA] = useState(30);
      const [unkB, setUnkB] = useState(30);
      const [isUnkReacted, setIsUnkReacted] = useState(false);
      const [ratioGuess, setRatioGuess] = useState({ a: '', b: '', c: '' });
      const [feedback, setFeedback] = useState(null);

      // 임의의 기체 반응 정답 데이터 (A : B : C)
      const unknownReactions = {
        1: { ans: [1, 3, 2], name: "반응 1" },
        2: { ans: [2, 1, 2], name: "반응 2" },
        3: { ans: [1, 1, 2], name: "반응 3" },
      };
      const currentUnkAns = unknownReactions[selectedRx].ans;

      // 미지의 반응 계산 로직
      const unkMaxRx = Math.min(Math.floor(unkA / currentUnkAns[0]), Math.floor(unkB / currentUnkAns[1]));
      const unkProducedC = unkMaxRx * currentUnkAns[2];
      const unkLeftA = unkA - (unkMaxRx * currentUnkAns[0]);
      const unkLeftB = unkB - (unkMaxRx * currentUnkAns[1]);
      const canUnkReact = unkMaxRx > 0;

      const handleRxChange = (rxNum) => {
        setSelectedRx(rxNum);
        setIsUnkReacted(false);
        setUnkA(30);
        setUnkB(30);
        setRatioGuess({ a: '', b: '', c: '' });
        setFeedback(null);
      };

      const handleRatioSubmit = () => {
        const { a, b, c } = ratioGuess;
        if (!a || !b || !c) return;

        if (
          parseInt(a) === currentUnkAns[0] &&
          parseInt(b) === currentUnkAns[1] &&
          parseInt(c) === currentUnkAns[2]
        ) {
          setFeedback('correct');
        } else {
          setFeedback('incorrect');
        }
      };

      return (
        <div className="min-h-screen p-4 md:p-6">
          <div className="max-w-6xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200 flex flex-col">
            
            {/* Header & Tabs */}
            <header className="bg-gradient-to-r from-blue-700 to-indigo-800 p-6 pb-0 text-white shrink-0">
              <h1 className="text-2xl md:text-3xl font-bold flex items-center gap-3">
                <Beaker className="w-8 h-8 text-blue-200" />
                기체 반응 법칙 가상 실험실
              </h1>
              <p className="mt-2 text-blue-100 text-sm md:text-base opacity-95">
                기체가 반응할 때 부피 사이에 어떤 규칙이 있는지 알아봅시다.
              </p>
              
              <div className="flex gap-2 mt-6 overflow-x-auto">
                <button 
                  onClick={() => setActiveTab('water')}
                  className={`px-6 py-3 rounded-t-xl font-bold transition-colors flex items-center gap-2 ${activeTab === 'water' ? 'bg-white text-indigo-700' : 'bg-indigo-900/50 text-indigo-100 hover:bg-indigo-800'}`}
                >
                  <FlaskConical className="w-5 h-5" /> 1. 물 합성 실험 (안내형)
                </button>
                <button 
                  onClick={() => setActiveTab('unknown')}
                  className={`px-6 py-3 rounded-t-xl font-bold transition-colors flex items-center gap-2 ${activeTab === 'unknown' ? 'bg-white text-indigo-700' : 'bg-indigo-900/50 text-indigo-100 hover:bg-indigo-800'}`}
                >
                  <BookOpen className="w-5 h-5" /> 2. 미지의 기체 반응 찾기 (탐구형)
                </button>
              </div>
            </header>

            {/* --- TAB 1: 물 합성 실험 --- */}
            {activeTab === 'water' && (
              <div className="animate-fade-in flex-1 overflow-auto">
                {/* Control Panel */}
                <div className="p-6 bg-slate-100 border-b border-slate-200 flex flex-col lg:flex-row gap-6 items-center justify-between">
                  <div className="flex flex-col sm:flex-row gap-6 w-full lg:w-auto flex-1">
                    <div className="flex-1 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                      <label className="block text-sm font-bold text-slate-700 mb-3 flex justify-between">
                        <span>수소 (H₂) 넣기</span>
                        <span className="text-blue-600 font-black">{h2Count} 부피</span>
                      </label>
                      <input type="range" min="0" max="10" value={h2Count} onChange={(e) => { setH2Count(parseInt(e.target.value)); setIsReacted(false); }} disabled={isReacted} className="w-full h-3 bg-blue-100 rounded-lg appearance-none cursor-pointer accent-blue-600" />
                    </div>
                    <div className="flex-1 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                      <label className="block text-sm font-bold text-slate-700 mb-3 flex justify-between">
                        <span>산소 (O₂) 넣기</span>
                        <span className="text-red-600 font-black">{o2Count} 부피</span>
                      </label>
                      <input type="range" min="0" max="5" value={o2Count} onChange={(e) => { setO2Count(parseInt(e.target.value)); setIsReacted(false); }} disabled={isReacted} className="w-full h-3 bg-red-100 rounded-lg appearance-none cursor-pointer accent-red-600" />
                    </div>
                  </div>

                  <div className="flex gap-3 w-full lg:w-auto justify-end mt-2 lg:mt-0">
                    {!isReacted ? (
                      <button onClick={() => setIsReacted(true)} disabled={h2Count === 0 && o2Count === 0} className="flex items-center justify-center gap-2 px-8 py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-lg transition-all disabled:opacity-50 transform hover:scale-105 w-full lg:w-auto text-lg">
                        <Play className="w-6 h-6" fill="currentColor" /> 반응시키기
                      </button>
                    ) : (
                      <button onClick={() => setIsReacted(false)} className="flex items-center justify-center gap-2 px-8 py-4 bg-slate-600 hover:bg-slate-700 text-white font-bold rounded-2xl shadow-lg transition-all transform hover:scale-105 w-full lg:w-auto text-lg">
                        <RefreshCw className="w-6 h-6" /> 다시 실험하기
                      </button>
                    )}
                  </div>
                </div>

                {/* Simulation Area */}
                <div className="p-6 lg:p-8 bg-white">
                  <div className="flex flex-col lg:flex-row gap-8 items-stretch">
                    <div className="flex-1 flex flex-col gap-6">
                      <div className="bg-slate-50 p-5 rounded-3xl border-2 border-slate-100">
                        <h2 className="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2">
                          <span className="bg-slate-200 w-8 h-8 rounded-full flex items-center justify-center text-sm">1</span> 반응 전 주사기
                        </h2>
                        <Syringe label="수소 기체" volume={h2Count} maxVolume={10} bgColor="bg-blue-200/60" isEmpty={h2Count === 0} />
                        <Syringe label="산소 기체" volume={o2Count} maxVolume={5} bgColor="bg-red-200/60" isEmpty={o2Count === 0} />
                      </div>
                    </div>

                    <div className="hidden lg:flex flex-col items-center justify-center relative w-12">
                       <ArrowRight className={`w-12 h-12 transition-colors duration-500 ${isReacted ? 'text-indigo-500' : 'text-slate-300'}`} />
                    </div>

                    <div className="flex-1 flex flex-col">
                      <div className={`p-5 rounded-3xl border-2 transition-all duration-700 h-full flex flex-col ${isReacted ? 'border-indigo-200 bg-indigo-50/30' : 'border-slate-100 bg-slate-50 opacity-60'}`}>
                        <h2 className="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2">
                          <span className={`w-8 h-8 rounded-full flex items-center justify-center text-sm ${isReacted ? 'bg-indigo-200 text-indigo-800' : 'bg-slate-200'}`}>2</span> 반응 후 결과
                        </h2>
                        <div className="relative mb-8">
                          <Syringe label={isReacted ? "반응 후 남은 기체" : "혼합 기체 (가상)"} volume={isReacted ? wTotalLeftoverVolume : wTotalInitialVolume} maxVolume={15} bgColor={isReacted ? "bg-slate-200/80" : "bg-purple-200/50"} isEmpty={isReacted ? wTotalLeftoverVolume === 0 : wTotalInitialVolume === 0} />
                        </div>
                        <div className={`mt-auto rounded-2xl border-2 p-4 transition-all duration-700 ${isReacted ? 'border-cyan-200 bg-cyan-50/50' : 'border-slate-200 bg-slate-100/50'}`}>
                          <div className="flex items-center gap-2 mb-3">
                            <Droplets className={`w-5 h-5 ${isReacted ? 'text-cyan-500' : 'text-slate-400'}`} />
                            <h3 className="text-sm font-bold text-slate-700">생성된 물 (액체)</h3>
                          </div>
                          <div className="min-h-[5rem] rounded-xl flex flex-wrap gap-2 items-end justify-center relative p-2">
                            {!isReacted ? <span className="text-sm text-slate-400 m-auto">반응 전</span> : wProducedH2O === 0 ? <span className="text-sm text-slate-400 m-auto">생성된 물 없음</span> : <>{h2oMolecules}<div className="absolute bottom-0 left-0 w-full h-1/3 bg-cyan-400/20 border-t border-cyan-300 rounded-b-xl"></div></>}
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* --- TAB 2: 미지의 기체 반응 실험 --- */}
            {activeTab === 'unknown' && (
              <div className="animate-fade-in bg-slate-50 flex-1 flex flex-col overflow-auto">
                
                {/* Reaction Selector */}
                <div className="p-4 md:p-6 border-b border-slate-200 bg-white">
                  <h2 className="text-lg font-bold text-slate-800 mb-4">탐구할 미지의 반응을 선택하세요</h2>
                  <div className="flex flex-wrap gap-3">
                    {[1, 2, 3].map(num => (
                      <button
                        key={num}
                        onClick={() => handleRxChange(num)}
                        className={`px-6 py-2 md:py-3 rounded-xl font-bold transition-all border-2 ${selectedRx === num ? 'border-indigo-500 bg-indigo-50 text-indigo-700 shadow-md' : 'border-slate-200 bg-white text-slate-500 hover:border-indigo-300 hover:bg-slate-50'}`}
                      >
                        {unknownReactions[num].name}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="p-4 md:p-6 flex-1 flex flex-col xl:flex-row gap-6">
                  
                  {/* 왼쪽: 실험 도구 및 컨트롤러 */}
                  <div className="flex-1 bg-white p-5 md:p-6 rounded-3xl border-2 border-slate-200 shadow-sm flex flex-col">
                    <div className="flex justify-between items-center mb-6 border-b pb-4">
                      <h3 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                        <FlaskConical className="w-6 h-6 text-indigo-600" />
                        기체 투입 및 반응
                      </h3>
                      {!isUnkReacted ? (
                        <button onClick={() => setIsUnkReacted(true)} disabled={!canUnkReact} className="flex items-center gap-2 px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition-all disabled:opacity-50 disabled:cursor-not-allowed transform hover:scale-105">
                          <Play className="w-5 h-5" fill="currentColor" /> 반응시키기
                        </button>
                      ) : (
                        <button onClick={() => {setIsUnkReacted(false); setFeedback(null);}} className="flex items-center gap-2 px-6 py-2.5 bg-slate-600 hover:bg-slate-700 text-white font-bold rounded-xl shadow-md transition-all transform hover:scale-105">
                          <RefreshCw className="w-5 h-5" /> 다시 실험
                        </button>
                      )}
                    </div>

                    {!canUnkReact && !isUnkReacted && (
                      <div className="mb-4 text-sm text-red-600 bg-red-50 p-2 rounded-lg flex items-center gap-2">
                        <AlertCircle className="w-4 h-4" /> 반응에 필요한 기체가 부족합니다. 슬라이더를 조절하세요.
                      </div>
                    )}

                    <div className="flex flex-col md:flex-row gap-6 mb-8">
                      <div className="flex-1 bg-emerald-50/50 p-4 rounded-2xl border border-emerald-100">
                        <label className="block text-sm font-bold text-emerald-800 mb-3 flex justify-between">
                          <span>초기 기체 A 넣기</span>
                          <span className="text-emerald-600 font-black">{unkA} 부피</span>
                        </label>
                        <input type="range" min="0" max="60" step="5" value={unkA} onChange={(e) => { setUnkA(parseInt(e.target.value)); setIsUnkReacted(false); }} disabled={isUnkReacted} className="w-full h-2 bg-emerald-200 rounded-lg appearance-none cursor-pointer accent-emerald-600" />
                      </div>
                      <div className="flex-1 bg-amber-50/50 p-4 rounded-2xl border border-amber-100">
                        <label className="block text-sm font-bold text-amber-800 mb-3 flex justify-between">
                          <span>초기 기체 B 넣기</span>
                          <span className="text-amber-600 font-black">{unkB} 부피</span>
                        </label>
                        <input type="range" min="0" max="60" step="5" value={unkB} onChange={(e) => { setUnkB(parseInt(e.target.value)); setIsUnkReacted(false); }} disabled={isUnkReacted} className="w-full h-2 bg-amber-200 rounded-lg appearance-none cursor-pointer accent-amber-600" />
                      </div>
                    </div>

                    <div className="flex flex-col gap-4">
                      {!isUnkReacted ? (
                        <>
                          <Syringe label="반응 전 기체 A" volume={unkA} maxVolume={60} bgColor="bg-emerald-200/60" isEmpty={unkA===0}/>
                          <Syringe label="반응 전 기체 B" volume={unkB} maxVolume={60} bgColor="bg-amber-200/60" isEmpty={unkB===0}/>
                          <Syringe label="생성된 기체 C (반응 전)" volume={0} maxVolume={120} bgColor="bg-purple-200/60" isEmpty={true}/>
                        </>
                      ) : (
                        <>
                          <Syringe label="남은 기체 A" volume={unkLeftA} maxVolume={60} bgColor="bg-emerald-200/60" isEmpty={unkLeftA===0}/>
                          <Syringe label="남은 기체 B" volume={unkLeftB} maxVolume={60} bgColor="bg-amber-200/60" isEmpty={unkLeftB===0}/>
                          <div className="relative mt-2 p-4 bg-purple-50 rounded-2xl border-2 border-purple-200">
                            <div className="absolute -top-3 left-4 bg-purple-100 text-purple-800 text-xs font-bold px-3 py-1 rounded-full border border-purple-200">
                              새롭게 생성된 기체
                            </div>
                            <Syringe label="생성된 기체 C" volume={unkProducedC} maxVolume={120} bgColor="bg-purple-300/80" isEmpty={unkProducedC===0}/>
                          </div>
                        </>
                      )}
                    </div>
                  </div>

                  {/* 오른쪽: 결과 분석 및 퀴즈 */}
                  <div className="w-full xl:w-[400px] flex flex-col gap-6">
                    
                    {/* 데이터 요약 패널 */}
                    <div className={`p-5 rounded-3xl border-2 transition-colors ${isUnkReacted ? 'bg-slate-800 border-slate-700 text-white shadow-lg' : 'bg-slate-100 border-slate-200 text-slate-400'}`}>
                      <h3 className="text-lg font-bold mb-4 flex items-center gap-2">
                        <Info className="w-5 h-5" /> 실험 결과표
                      </h3>
                      {isUnkReacted ? (
                        <div className="space-y-4 text-sm mt-2">
                          <div className="bg-slate-700/50 p-3 rounded-xl">
                            <p className="text-slate-300 mb-1">초기 투입 기체</p>
                            <p className="text-base">A <b className="text-emerald-400">{unkA}</b>부피, B <b className="text-amber-400">{unkB}</b>부피</p>
                          </div>
                          
                          <div className="bg-slate-700/50 p-3 rounded-xl border border-slate-600">
                            <p className="text-slate-300 mb-1">반응 후 남은 기체</p>
                            <p className="text-lg text-white">A <b className="text-emerald-400">{unkLeftA}</b>부피, B <b className="text-amber-400">{unkLeftB}</b>부피</p>
                          </div>

                          <div className="bg-purple-900/30 p-3 rounded-xl border border-purple-800/50">
                            <p className="text-purple-300 mb-1">생성된 기체 C</p>
                            <p className="text-lg text-white"><b className="text-purple-400">{unkProducedC}</b>부피</p>
                          </div>
                        </div>
                      ) : (
                        <p className="text-sm italic text-center py-10">
                          '반응시키기' 버튼을 눌러 결과를 확인하세요.
                        </p>
                      )}
                    </div>

                    {/* 반응비 추론 퀴즈 */}
                    <div className="bg-indigo-50 p-6 rounded-3xl border-2 border-indigo-200 shadow-sm flex-1 flex flex-col">
                      <h3 className="text-xl font-bold text-indigo-900 mb-2">반응 부피비 구하기</h3>
                      <p className="text-sm text-indigo-700/80 mb-6">
                        결과표를 보고 <b>(초기 부피 - 남은 부피)</b>를 계산하여 <b>실제로 반응한 기체(A, B)</b>의 부피를 구해보세요. 그 후 <b>생성된 기체(C)</b>의 부피와 함께 가장 간단한 정수비로 나타내보세요.
                      </p>

                      <div className="bg-white p-6 rounded-2xl mb-6 shadow-sm">
                        <div className="flex justify-between text-sm font-bold text-slate-600 mb-3 px-2">
                          <span className="text-emerald-700">기체 A</span>
                          <span className="text-amber-700">기체 B</span>
                          <span className="text-purple-700">기체 C</span>
                        </div>
                        <div className="flex items-center justify-between gap-2">
                          <input type="number" min="1" max="10" value={ratioGuess.a} onChange={e => {setRatioGuess({...ratioGuess, a: e.target.value}); setFeedback(null);}} disabled={!isUnkReacted} className="w-14 h-14 md:w-16 md:h-16 text-center text-xl md:text-2xl font-black rounded-xl border-2 border-slate-300 focus:border-indigo-500 outline-none disabled:bg-slate-100 disabled:opacity-50" />
                          <span className="text-2xl font-bold text-slate-400">:</span>
                          <input type="number" min="1" max="10" value={ratioGuess.b} onChange={e => {setRatioGuess({...ratioGuess, b: e.target.value}); setFeedback(null);}} disabled={!isUnkReacted} className="w-14 h-14 md:w-16 md:h-16 text-center text-xl md:text-2xl font-black rounded-xl border-2 border-slate-300 focus:border-indigo-500 outline-none disabled:bg-slate-100 disabled:opacity-50" />
                          <span className="text-2xl font-bold text-slate-400">:</span>
                          <input type="number" min="1" max="10" value={ratioGuess.c} onChange={e => {setRatioGuess({...ratioGuess, c: e.target.value}); setFeedback(null);}} disabled={!isUnkReacted} className="w-14 h-14 md:w-16 md:h-16 text-center text-xl md:text-2xl font-black rounded-xl border-2 border-slate-300 focus:border-indigo-500 outline-none disabled:bg-slate-100 disabled:opacity-50" />
                        </div>
                      </div>

                      <button 
                        onClick={handleRatioSubmit}
                        disabled={!ratioGuess.a || !ratioGuess.b || !ratioGuess.c || !isUnkReacted}
                        className="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed mt-auto"
                      >
                        정답 확인하기
                      </button>

                      {/* Feedback Message */}
                      {feedback && (
                        <div className={`mt-4 p-4 rounded-xl flex items-start gap-3 animate-fade-in ${feedback === 'correct' ? 'bg-green-100 text-green-800 border border-green-300' : 'bg-red-100 text-red-800 border border-red-300'}`}>
                          {feedback === 'correct' ? (
                            <>
                              <CheckCircle2 className="w-6 h-6 shrink-0 text-green-600" />
                              <div>
                                <p className="font-bold text-green-900">정답입니다!</p>
                                <p className="text-sm mt-1">부피비 <b>{currentUnkAns.join(' : ')}</b> 규칙을 찾으셨군요. 아무리 부피를 다르게 넣어도 실제로 반응하는 기체들의 부피비는 항상 일정합니다.</p>
                              </div>
                            </>
                          ) : (
                            <>
                              <XCircle className="w-6 h-6 shrink-0 text-red-600" />
                              <div>
                                <p className="font-bold text-red-900">오답입니다.</p>
                                <p className="text-sm mt-1"><b>(초기 부피 - 남은 부피)</b>를 계산하여 <b>실제로 반응한 기체의 부피</b>를 먼저 구해보세요. 그 수치들을 최대공약수로 나누어 가장 간단한 자연수 비를 만들어야 합니다.</p>
                              </div>
                            </>
                          )}
                        </div>
                      )}
                    </div>
                  </div>

                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    // 렌더링
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
